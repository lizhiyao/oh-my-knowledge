name: Test Performance Profile

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Measured full-suite runs
        required: true
        default: '3'
        type: string
      warmup:
        description: Warmup full-suite runs
        required: true
        default: '1'
        type: string
      max-workers:
        description: Vitest max workers (integer or percentage)
        required: true
        default: '55%'
        type: string
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

concurrency:
  group: test-profile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  profile:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'test-profile')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROFILE_RUNS: ${{ inputs.runs || '3' }}
      PROFILE_WARMUP: ${{ inputs.warmup || '1' }}
      PROFILE_MAX_WORKERS: ${{ inputs['max-workers'] || '55%' }}
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - name: Run controlled profile
        run: >-
          yarn test:profile
          --runs "${PROFILE_RUNS}"
          --warmup "${PROFILE_WARMUP}"
          --max-workers "${PROFILE_MAX_WORKERS}"
          --output .omk/test-profiles/ci
      - name: Publish job summary
        if: ${{ !cancelled() && hashFiles('.omk/test-profiles/ci/summary.json') != '' }}
        run: |
          jq -r '
            "## Test performance profile\n\n" +
            "- Commit: `" + .git.commit + "`\n" +
            "- Node / Vitest: `" + .environment.nodeVersion + "` / `" + .environment.vitestVersion + "`\n" +
            "- Runner: `ubuntu-24.04`, parallelism " + (.environment.availableParallelism | tostring) + "\n" +
            "- Workers: `" + .command.maxWorkers + "`\n" +
            "- Wall median: **" + ((.summary.wallTimeMs.median / 1000) | tostring) + " s**\n" +
            "- Wall range: " + ((.summary.wallTimeMs.min / 1000) | tostring) + "–" + ((.summary.wallTimeMs.max / 1000) | tostring) + " s\n" +
            "- CV: " + (.summary.wallTimeMs.coefficientOfVariation | tostring)
          ' .omk/test-profiles/ci/summary.json >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload raw profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-profile-${{ github.sha }}
          path: .omk/test-profiles/ci/
          if-no-files-found: warn
          retention-days: 14
