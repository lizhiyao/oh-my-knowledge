name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同 PR 推 N 次只跑最后一次，省 GitHub Actions minutes。main push 同样适用。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Enable Corepack before setup-node so its `cache: yarn` step resolves the
      # cache folder via the packageManager-pinned Yarn 4, not the runner's
      # preinstalled Yarn 1.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn ci:quality

  test_22_shard:
    name: test shard (22, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test --shard=${{ matrix.shard }}/2

  test_24_shard:
    name: test shard (24, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test --shard=${{ matrix.shard }}/2

  # Keep the required status names stable while the full suites run in parallel.
  test_22:
    name: test (22)
    if: ${{ always() }}
    needs: [quality, test_22_shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality and every Node 22 shard
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARD_RESULT: ${{ needs.test_22_shard.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$SHARD_RESULT" = success

  test_24:
    name: test (24)
    if: ${{ always() }}
    needs: [quality, test_24_shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality and every Node 24 shard
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARD_RESULT: ${{ needs.test_24_shard.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$SHARD_RESULT" = success
