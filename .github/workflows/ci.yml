name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同 PR 推 N 次只跑最后一次，省 GitHub Actions minutes。main push 同样适用。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the complete change against the event base
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/scope.mjs

  lightweight:
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'rules' || needs.changes.outputs.scope == 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Check changed text and repository rules
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          git diff --check "$CI_BASE_SHA" "$CI_HEAD_SHA" --
          yarn test test/scripts/review-governance.test.ts test/scripts/ci-scope.test.ts
      - name: Check documentation contracts and build the site
        if: ${{ needs.changes.outputs.scope == 'docs' }}
        run: |
          yarn build:runtime
          yarn build:docs:check
          yarn test test/scripts/markdown-cmd-refs.test.ts test/scripts/docs-i18n-mirror-links.test.ts test/scripts/vitepress-config-links.test.ts test/scripts/evaluation-docs-current-contract.test.ts test/scripts/eval-core-terminology-guard.test.ts test/scripts/eval-runtime-facade-guard.test.ts test/eval-runtime/public-api.test.ts
          yarn docs:build

  quality:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || (needs.changes.outputs.scope != 'rules' && needs.changes.outputs.scope != 'docs')) }}
    runs-on: ubuntu-latest
    # 实测 1.6~2.6 分钟；没有超时则卡死的 runner 会一直占着作业，直到平台回收。
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      # Enable Corepack before setup-node so its `cache: yarn` step resolves the
      # cache folder via the packageManager-pinned Yarn 4, not the runner's
      # preinstalled Yarn 1.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # unknown_signal（进程被杀但无 OOM 证据）允许整体重试一次，时限跨尝试共享，不超包络。
      - run: node scripts/ci/diagnostics.mjs run quality "$RUNNER_TEMP/ci-diagnostics" 600000 --retry-on=unknown_signal yarn ci:quality
      - name: Summarize diagnostics
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/diagnostics.mjs report "$RUNNER_TEMP/ci-diagnostics"
      - name: Save diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-diagnostics
          retention-days: 14

  test_22_shard:
    needs: changes
    # PR 只跑 24（与主要开发环境一致，本地反馈环一致）；22 由 main/release/publish 与
    # dependabot PR（依赖更新是版本相关破坏高发场景）保留。issue #932 实测近 40 轮
    # 22 与 24 无一次真正的测试结论分歧，22 的「下限守卫」近期未拦到任何问题。
    if: ${{ always() && (needs.changes.result != 'success' || (needs.changes.outputs.scope != 'rules' && needs.changes.outputs.scope != 'docs')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'dependencies')) }}
    name: test shard (22, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 实测成功作业最长约 4.1 分钟；不给超时则失联的 runner 会把作业占满到平台默认上限。
    timeout-minutes: 12
    strategy:
      fail-fast: false
      # 分片按 `yarn test:profile` 实测时长贪心装箱（test/shards/source-*.txt），替代 vitest --shard
      # 的下标切片（重活集中字母序前段导致 105s/27s 倾斜）。
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      # 进程超时早于作业超时，保留测试进度、资源采样与退出分类。
      # 预算：720s 作业上限 − 约 80s checkout/install/build − 30s kill 宽限 ⇒ 610s，取整到 540s。
      # hermetic 后置快照在 yarn test 内部，已经被 540s 覆盖。余量是最慢分片实测墙钟的数倍。
      # xargs 把清单文件转成 vitest 位置参数（放在命令末尾，不带 `--`；`--` 会让 vitest 把文件当
      # 字面 pattern 而跑全量）。maxWorkers=1：装箱把重活分散到各 shard，默认 workers（2 核 runner
      # 可能 2 workers）会叠加两个重文件的子进程内存峰值导致 runner SIGKILL（实测 shard 3/4 被杀）。
      # unknown_signal（进程被杀但无 OOM 证据）整体重试一次，时限跨尝试共享（540s 包络不变，重试
      # 只拿剩余预算）；CI_DIAGNOSTICS_DIR 挂上进度 reporter，崩溃时最后一个未配对 start 即现场。
      - run: xargs -a test/shards/source-${{ matrix.shard }}.txt node scripts/ci/diagnostics.mjs run tests "$RUNNER_TEMP/ci-diagnostics" 540000 --retry-on=unknown_signal yarn test --maxWorkers=1
        env:
          CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/ci-diagnostics
      - name: Summarize diagnostics
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/diagnostics.mjs report "$RUNNER_TEMP/ci-diagnostics"
      - name: Save diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-diagnostics
          retention-days: 14

  test_24_shard:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || (needs.changes.outputs.scope != 'rules' && needs.changes.outputs.scope != 'docs')) }}
    name: test shard (24, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      # xargs 把清单文件转成 vitest 位置参数（放在命令末尾，不带 `--`；`--` 会让 vitest 把文件当
      # 字面 pattern 而跑全量）。maxWorkers=1：装箱把重活分散到各 shard，默认 workers（2 核 runner
      # 可能 2 workers）会叠加两个重文件的子进程内存峰值导致 runner SIGKILL（实测 shard 3/4 被杀）。
      # unknown_signal（进程被杀但无 OOM 证据）整体重试一次，时限跨尝试共享（540s 包络不变，重试
      # 只拿剩余预算）；CI_DIAGNOSTICS_DIR 挂上进度 reporter，崩溃时最后一个未配对 start 即现场。
      - run: xargs -a test/shards/source-${{ matrix.shard }}.txt node scripts/ci/diagnostics.mjs run tests "$RUNNER_TEMP/ci-diagnostics" 540000 --retry-on=unknown_signal yarn test --maxWorkers=1
        env:
          CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/ci-diagnostics
      - name: Summarize diagnostics
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/diagnostics.mjs report "$RUNNER_TEMP/ci-diagnostics"
      - name: Save diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-diagnostics
          retention-days: 14

  # macOS 平台风险边界检查：文件存储、目录发现、子进程、CLI 启动、Studio 服务生命周期。
  # 不跑全量，只跑平台差异高风险测试；接入合并门禁，失败阻止合并。
  test_macos:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || (needs.changes.outputs.scope != 'rules' && needs.changes.outputs.scope != 'docs')) }}
    name: test (macOS)
    runs-on: macos-latest
    # 预算：安装＋构建＋风险边界测试实测 148s，打包与安装冒烟上限 120s＋420s；留并发余量。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      # 平台风险边界测试：文件存储、目录发现、子进程、CLI 启动、Studio 服务生命周期
      # 选择依据：macOS 与 Linux 在这些边界存在实际差异（文件系统大小写、进程信号、路径解析等）
      - run: node scripts/ci/diagnostics.mjs run tests "$RUNNER_TEMP/ci-diagnostics" 600000 --retry-on=unknown_signal yarn test --maxWorkers=1 test/evidence/storage/ test/cli/oclif-startup.test.ts test/cli/oclif-dispatch.test.ts test/cli/first-run-smoke.test.ts test/cli/studio-dev-spawn.test.ts test/studio/http/server-lifecycle.test.ts test/studio/http/next-studio.test.ts
        env:
          CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/ci-diagnostics
      # 打包资源边界：复用发布链的同一脚本，验证 tarball 在 macOS 上可安装、可启动、资源齐全。
      # 与 publish.yml 的 pack/package-smoke 保持单一来源，避免 CI 与发版各跑一套。
      - name: Pack the built bytes
        run: node scripts/ci/diagnostics.mjs run macos-pack "$RUNNER_TEMP/ci-diagnostics" 120000 node scripts/release/package.mjs pack "$RUNNER_TEMP/macos-package"
      - name: Verify the package through an isolated installation
        run: node scripts/ci/diagnostics.mjs run macos-package-smoke "$RUNNER_TEMP/ci-diagnostics" 420000 node scripts/release/package.mjs smoke "$RUNNER_TEMP/macos-package"
      - name: Summarize diagnostics
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/diagnostics.mjs report "$RUNNER_TEMP/ci-diagnostics"
      - name: Save diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-diagnostics
          retention-days: 14

  # Required names stay stable. A skipped suite is valid only after an explicit light gate succeeds.
  test_22:
    name: test (22)
    if: ${{ always() }}
    needs: [changes, lightweight, quality, test_22_shard, test_macos]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the selected gate
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          LIGHT_RESULT: ${{ needs.lightweight.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARD_RESULT: ${{ needs.test_22_shard.result }}
          MACOS_RESULT: ${{ needs.test_macos.result }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          IS_DEPENDABOT: ${{ contains(github.event.pull_request.labels.*.name, 'dependencies') }}
        run: |
          # PR 非 dependabot 时 test_22_shard 跳过（PR 只跑 24），门禁接受 skipped。
          if [ "$IS_PR" = "true" ] && [ "$IS_DEPENDABOT" != "true" ]; then
            test "$SHARD_RESULT" = skipped
          elif [ "$CHANGE_RESULT" = success ] && { [ "$SCOPE" = rules ] || [ "$SCOPE" = docs ]; }; then
            test "$LIGHT_RESULT" = success
            test "$QUALITY_RESULT" = skipped
            test "$SHARD_RESULT" = skipped
            test "$MACOS_RESULT" = skipped
          else
            test "$QUALITY_RESULT" = success
            test "$SHARD_RESULT" = success
            test "$MACOS_RESULT" = success
          fi

  test_24:
    name: test (24)
    if: ${{ always() }}
    needs: [changes, lightweight, quality, test_24_shard, test_macos]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the selected gate
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          LIGHT_RESULT: ${{ needs.lightweight.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARD_RESULT: ${{ needs.test_24_shard.result }}
          MACOS_RESULT: ${{ needs.test_macos.result }}
        run: |
          if [ "$CHANGE_RESULT" = success ] && { [ "$SCOPE" = rules ] || [ "$SCOPE" = docs ]; }; then
            test "$LIGHT_RESULT" = success
            test "$QUALITY_RESULT" = skipped
            test "$SHARD_RESULT" = skipped
            test "$MACOS_RESULT" = skipped
          else
            test "$QUALITY_RESULT" = success
            test "$SHARD_RESULT" = success
            test "$MACOS_RESULT" = success
          fi
