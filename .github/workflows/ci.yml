name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同 PR 推 N 次只跑最后一次，省 GitHub Actions minutes。main push 同样适用。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the complete change against the event base
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/scope.mjs

  lightweight:
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'rules' || needs.changes.outputs.scope == 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Check changed text and repository rules
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          git diff --check "$CI_BASE_SHA" "$CI_HEAD_SHA" --
          yarn test test/scripts/review-governance.test.ts test/scripts/ci-scope.test.ts
      - name: Check documentation contracts and build the site
        if: ${{ needs.changes.outputs.scope == 'docs' }}
        run: |
          yarn build:runtime
          yarn build:docs:check
          yarn test test/scripts/markdown-cmd-refs.test.ts test/scripts/docs-i18n-mirror-links.test.ts test/scripts/vitepress-config-links.test.ts test/scripts/evaluation-docs-current-contract.test.ts test/scripts/eval-core-terminology-guard.test.ts test/scripts/eval-runtime-facade-guard.test.ts test/eval-runtime/public-api.test.ts
          yarn docs:build

  quality:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || (needs.changes.outputs.scope != 'rules' && needs.changes.outputs.scope != 'docs')) }}
    runs-on: ubuntu-latest
    # 实测 1.6~2.6 分钟；没有超时则卡死的 runner 会一直占着作业，直到平台回收。
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      # Enable Corepack before setup-node so its `cache: yarn` step resolves the
      # cache folder via the packageManager-pinned Yarn 4, not the runner's
      # preinstalled Yarn 1.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: node scripts/ci/diagnostics.mjs run quality "$RUNNER_TEMP/ci-diagnostics" 600000 yarn ci:quality
      - name: Summarize diagnostics
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/diagnostics.mjs report "$RUNNER_TEMP/ci-diagnostics"
      - name: Save diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-diagnostics
          retention-days: 14

  test_22_shard:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || (needs.changes.outputs.scope != 'rules' && needs.changes.outputs.scope != 'docs')) }}
    name: test shard (22, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 实测成功作业最长约 4.1 分钟；不给超时则失联的 runner 会把作业占满到平台默认上限。
    timeout-minutes: 12
    strategy:
      fail-fast: false
      # 分片按 `yarn test:profile` 实测时长贪心装箱（test/shards/source-*.txt），替代 vitest --shard
      # 的下标切片（重活集中字母序前段导致 105s/27s 倾斜）。
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      # 进程超时早于作业超时，保留测试进度、资源采样与退出分类。
      # 预算：720s 作业上限 − 约 80s checkout/install/build − 30s kill 宽限 ⇒ 610s，取整到 540s。
      # hermetic 后置快照在 yarn test 内部，已经被 540s 覆盖。余量是最慢分片实测墙钟的数倍。
      # xargs 把清单文件转成 vitest 位置参数（放在命令末尾，不带 `--`；`--` 会让 vitest 把文件当
      # 字面 pattern 而跑全量）。maxWorkers 不显式配置：2 核 runner 默认即 1-2 workers。
      - run: xargs -a test/shards/source-${{ matrix.shard }}.txt node scripts/ci/diagnostics.mjs run tests "$RUNNER_TEMP/ci-diagnostics" 540000 yarn test
      - name: Summarize diagnostics
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/diagnostics.mjs report "$RUNNER_TEMP/ci-diagnostics"
      - name: Save diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-diagnostics
          retention-days: 14

  test_24_shard:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || (needs.changes.outputs.scope != 'rules' && needs.changes.outputs.scope != 'docs')) }}
    name: test shard (24, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      # xargs 把清单文件转成 vitest 位置参数（放在命令末尾，不带 `--`；`--` 会让 vitest 把文件当
      # 字面 pattern 而跑全量）。maxWorkers 不显式配置：2 核 runner 默认即 1-2 workers。
      - run: xargs -a test/shards/source-${{ matrix.shard }}.txt node scripts/ci/diagnostics.mjs run tests "$RUNNER_TEMP/ci-diagnostics" 540000 yarn test
      - name: Summarize diagnostics
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/diagnostics.mjs report "$RUNNER_TEMP/ci-diagnostics"
      - name: Save diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-diagnostics
          retention-days: 14

  # Required names stay stable. A skipped suite is valid only after an explicit light gate succeeds.
  test_22:
    name: test (22)
    if: ${{ always() }}
    needs: [changes, lightweight, quality, test_22_shard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the selected gate
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          LIGHT_RESULT: ${{ needs.lightweight.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARD_RESULT: ${{ needs.test_22_shard.result }}
        run: |
          if [ "$CHANGE_RESULT" = success ] && { [ "$SCOPE" = rules ] || [ "$SCOPE" = docs ]; }; then
            test "$LIGHT_RESULT" = success
            test "$QUALITY_RESULT" = skipped
            test "$SHARD_RESULT" = skipped
          else
            test "$QUALITY_RESULT" = success
            test "$SHARD_RESULT" = success
          fi

  test_24:
    name: test (24)
    if: ${{ always() }}
    needs: [changes, lightweight, quality, test_24_shard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the selected gate
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          LIGHT_RESULT: ${{ needs.lightweight.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARD_RESULT: ${{ needs.test_24_shard.result }}
        run: |
          if [ "$CHANGE_RESULT" = success ] && { [ "$SCOPE" = rules ] || [ "$SCOPE" = docs ]; }; then
            test "$LIGHT_RESULT" = success
            test "$QUALITY_RESULT" = skipped
            test "$SHARD_RESULT" = skipped
          else
            test "$QUALITY_RESULT" = success
            test "$SHARD_RESULT" = success
          fi
