name: CD - Publish to NPM

on:
  push:
    tags:
      - 'v*' # 仅在推送以 'v' 开头的 Tag 时触发，例如 v0.19.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release(npm publish 完成后自动建, release notes 由 GitHub 从 PR 列表自动生成)
      id-token: write # npm Trusted Publishing 通过 OIDC 换取短期发布凭证，并自动生成 provenance

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false

    - name: Setup package managers
      run: |
        corepack enable
        npm install --global 'npm@^11.5.1'
        node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)" "$(npm --version)"

    - name: Install dependencies
      run: yarn install --immutable

    - name: Validate release tag
      id: release
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${GITHUB_ACTOR}" != "lizhiyao" ]]; then
          echo "::error::Only lizhiyao is allowed to trigger an npm release."
          exit 1
        fi

        # actions/checkout checks out the tag target commit for tag-triggered runs.
        # Fetch the tag ref explicitly so annotated-tag validation checks the tag
        # object instead of the dereferenced commit.
        git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
        tag_ref="refs/tags/${GITHUB_REF_NAME}"
        tag_type="$(git cat-file -t "${tag_ref}")"
        if [[ "${tag_type}" != "tag" ]]; then
          echo "::error::Release tag ${GITHUB_REF_NAME} must be an annotated tag."
          exit 1
        fi

        package_version="$(node -p "require('./package.json').version")"
        expected_tag="v${package_version}"
        if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
          echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}."
          exit 1
        fi

        if [[ "${package_version}" == *-* ]]; then
          echo "npm_tag=next" >> "${GITHUB_OUTPUT}"
          echo "github_prerelease=true" >> "${GITHUB_OUTPUT}"
        else
          echo "npm_tag=latest" >> "${GITHUB_OUTPUT}"
          echo "github_prerelease=false" >> "${GITHUB_OUTPUT}"
        fi

        git fetch --no-tags origin main
        tag_commit="$(git rev-list -n 1 "${tag_ref}")"
        if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
          echo "::error::Release tag ${GITHUB_REF_NAME} must point to a commit reachable from origin/main."
          exit 1
        fi

    - name: Run Lint
      run: yarn run lint

    - name: Build Project
      run: yarn run build

    - name: Run Tests
      run: yarn run test

    - name: Publish to NPM
      run: npm publish --access public --tag "${{ steps.release.outputs.npm_tag }}"

    # softprops/action-gh-release 是行业通用 GitHub Release action (~17k stars)。
    # generate_release_notes 让 GitHub 直接从 tag 之间的 PR 列表自动生成
    # "What's Changed" + "Full Changelog: compare URL"。不再维护单独的 CHANGELOG.md —
    # PR title / description 是唯一信息源, BREAKING / migration 在 PR 描述里写清楚。
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        prerelease: ${{ steps.release.outputs.github_prerelease }}
