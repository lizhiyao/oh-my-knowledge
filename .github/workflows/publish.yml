name: CD - Publish to NPM

on:
  push:
    tags:
      - 'v*'

# Serialize publication, including different tags updating the same npm channel.
concurrency:
  group: npm-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Stage deadlines total 27 minutes; reserve time for setup and diagnostics.
    timeout-minutes: 32
    permissions:
      contents: read
      actions: read
    outputs:
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      github_prerelease: ${{ steps.release.outputs.github_prerelease }}
      artifact_name: release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        package-manager-cache: false
    - name: Validate release tag
      id: release
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${GITHUB_ACTOR}" != "lizhiyao" ]]; then
          echo "::error::Only lizhiyao is allowed to trigger an npm release."
          exit 1
        fi

        # actions/checkout checks out the tag target commit for tag-triggered runs.
        # Fetch the tag ref explicitly so annotated-tag validation checks the tag
        # object instead of the dereferenced commit.
        git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
        tag_ref="refs/tags/${GITHUB_REF_NAME}"
        tag_type="$(git cat-file -t "${tag_ref}")"
        if [[ "${tag_type}" != "tag" ]]; then
          echo "::error::Release tag ${GITHUB_REF_NAME} must be an annotated tag."
          exit 1
        fi

        package_version="$(node -p "require('./package.json').version")"
        expected_tag="v${package_version}"
        if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
          echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}."
          exit 1
        fi

        if [[ "${package_version}" == *-* ]]; then
          echo "npm_tag=next" >> "${GITHUB_OUTPUT}"
          echo "github_prerelease=true" >> "${GITHUB_OUTPUT}"
        else
          echo "npm_tag=latest" >> "${GITHUB_OUTPUT}"
          echo "github_prerelease=false" >> "${GITHUB_OUTPUT}"
        fi

        git fetch --no-tags origin main
        tag_commit="$(git rev-list -n 1 "${tag_ref}")"
        if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
          echo "::error::Release tag moved after this run started."
          exit 1
        fi
        if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
          echo "::error::Release tag ${GITHUB_REF_NAME} must point to a commit reachable from origin/main."
          exit 1
        fi

    - name: Require full CI evidence for the exact release commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/ci/diagnostics.mjs run ci-evidence "$RUNNER_TEMP/release-diagnostics" 660000 node scripts/release/evidence.mjs "$RUNNER_TEMP/release-bundle"
    - name: Setup package managers
      run: corepack enable
    - name: Install dependencies
      run: node scripts/ci/diagnostics.mjs run install "$RUNNER_TEMP/release-diagnostics" 240000 yarn install --immutable
    - name: Build once
      run: node scripts/ci/diagnostics.mjs run build "$RUNNER_TEMP/release-diagnostics" 300000 yarn build
    - name: Pack the built bytes
      run: node scripts/ci/diagnostics.mjs run pack "$RUNNER_TEMP/release-diagnostics" 60000 node scripts/release/package.mjs pack "$RUNNER_TEMP/release-bundle"
    - name: Verify the package through an isolated installation
      run: node scripts/ci/diagnostics.mjs run package-smoke "$RUNNER_TEMP/release-diagnostics" 360000 node scripts/release/package.mjs smoke "$RUNNER_TEMP/release-bundle"
    - name: Save verified package and evidence
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/release-bundle
        if-no-files-found: error
        retention-days: 14
    - name: Summarize diagnostics
      if: ${{ always() }}
      env:
        CI_JOB_STATUS: ${{ job.status }}
      run: node scripts/ci/diagnostics.mjs report "$RUNNER_TEMP/release-diagnostics"
    - name: Save diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: release-verify-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/release-diagnostics
        retention-days: 14

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false
    - name: Setup package managers
      run: |
        npm install --global 'npm@^11.5.1'
        node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)" "$(npm --version)"
    - name: Download verified package
      uses: actions/download-artifact@v7
      with:
        name: ${{ needs.verify.outputs.artifact_name }}
        path: ${{ runner.temp }}/release-bundle
    - name: Publish to NPM
      env:
        NPM_DIST_TAG: ${{ needs.verify.outputs.npm_tag }}
      run: node scripts/ci/diagnostics.mjs run publish "$RUNNER_TEMP/release-diagnostics" 240000 node scripts/release/package.mjs publish "$RUNNER_TEMP/release-bundle" "$NPM_DIST_TAG"
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        prerelease: ${{ needs.verify.outputs.github_prerelease }}
    - name: Summarize diagnostics
      if: ${{ always() }}
      env:
        CI_JOB_STATUS: ${{ job.status }}
      run: node scripts/ci/diagnostics.mjs report "$RUNNER_TEMP/release-diagnostics"
    - name: Save diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: release-publish-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/release-diagnostics
        retention-days: 14
