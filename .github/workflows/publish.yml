name: CD - Publish to NPM

on:
  push:
    tags:
      - 'v*' # 仅在推送以 'v' 开头的 Tag 时触发，例如 v0.19.0

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release(npm publish 完成后自动建, release notes 由 GitHub 从 PR 列表自动生成)
      id-token: write # 使工作流能够通过 OIDC 从 GitHub 获取凭证（npm provenance 必需）

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        registry-url: 'https://registry.npmjs.org'
        cache: yarn

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run Lint
      run: yarn run lint

    - name: Build Project
      run: yarn run build

    - name: Run Tests
      run: yarn run test

    - name: Publish to NPM
      run: npm publish --access public --provenance
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    # softprops/action-gh-release 是行业通用 GitHub Release action (~17k stars)。
    # generate_release_notes 让 GitHub 直接从 tag 之间的 PR 列表自动生成
    # "What's Changed" + "Full Changelog: compare URL"。不再维护单独的 CHANGELOG.md —
    # PR title / description 是唯一信息源, BREAKING / migration 在 PR 描述里写清楚。
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
