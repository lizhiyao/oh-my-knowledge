samples:
  - sample_id: refund-window
    prompt: "What is the refund window for the Pro plan?"
    context: |
      Pricing policy:
      - Starter plan refunds are available within 7 days.
      - Pro plan refunds are available within 14 days.
      - Enterprise contracts use the signed order form.
    assertions:
      - type: faithfulness
        threshold: 4
      - type: answer_relevancy
        threshold: 4
      - type: context_recall
        reference: "Pro plan refunds are available within 14 days."

  - sample_id: unsupported-sla
    prompt: "What uptime SLA does the Pro plan include?"
    context: |
      Pricing policy:
      - Starter plan refunds are available within 7 days.
      - Pro plan refunds are available within 14 days.
      - Enterprise contracts use the signed order form.
    assertions:
      - type: contains_any
        values: ["unspecified", "context", "mention"]
      - type: faithfulness
        threshold: 4

  - sample_id: enterprise-source
    prompt: "Where should I check Enterprise refund terms?"
    context: |
      Pricing policy:
      - Starter plan refunds are available within 7 days.
      - Pro plan refunds are available within 14 days.
      - Enterprise contracts use the signed order form.
    assertions:
      - type: context_recall
        reference: "Enterprise contracts use the signed order form."
      - type: answer_relevancy
        threshold: 4
