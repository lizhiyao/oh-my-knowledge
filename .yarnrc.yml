# Yarn 4 defaults enableScripts to false: third-party postinstall scripts are
# skipped (supply-chain hardening), while the root workspace's own scripts still
# run. We intentionally rely on this secure default — do NOT add
# `enableScripts: true` (that reverts to Yarn 1's run-everything behavior). If a
# trusted dependency genuinely needs its build script, allow-list only that
# package via `dependenciesMeta.<pkg>.built` in package.json.
nodeLinker: node-modules

# The experimental DSH adapter uses the SDK client as a pure stdio transport
# and provides its only runtime import (`dsh-sdk-protocol`) directly. The SDK's
# remaining peers are type-level references to the full DSH runtime ecosystem;
# OMK deliberately keeps them outside its dependency graph and consumes the
# run result through a local structural boundary.
packageExtensions:
  "@deepseek-ai/dsh-sdk-client@0.1.1-rc.2":
    peerDependenciesMeta:
      "@deepseek-ai/cordis":
        optional: true
      "@deepseek-ai/dsh-invariants":
        optional: true
      "@deepseek-ai/dsh-llm":
        optional: true
      "@deepseek-ai/dsh-session":
        optional: true
  "@deepseek-ai/dsh-sdk-protocol@0.1.1-rc.2":
    peerDependenciesMeta:
      "@deepseek-ai/cordis":
        optional: true
      "@deepseek-ai/dsh-invariants":
        optional: true
      "@deepseek-ai/dsh-llm":
        optional: true
      "@deepseek-ai/dsh-session":
        optional: true
      "@deepseek-ai/dsh-subagent":
        optional: true
